<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ephemeral Chat System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Ephemeral Chat</h1>
      <p>No login, no persistence. Your chat clears when the connection closes.</p>
    </header>

    <main>
      <section id="landing" class="screen active">
        <div class="card">
          <p class="section-title">Connect with a peer</p>
          <p class="section-copy">Share your ID or paste your friend's 5-character code to start the chat instantly.</p>
          <div class="section-label">Your ID</div>
          <div class="identity-row">
            <div id="assignedId" class="identity">—</div>
            <button id="copyIdBtn" class="copy-button" type="button">Copy</button>
          </div>
          <label for="peerId">Enter peer ID</label>
          <input id="peerId" class="inputPeerId" placeholder="ABCDE" maxlength="5" />
          <button id="connectBtn">Connect</button>
          <div id="landingMessage" class="message"></div>
        </div>
      </section>

      <section id="waiting" class="screen">
        <div class="card">
          <p>Waiting for peer...</p>
          <div id="waitingStatus" class="status"></div>
          <button id="cancelWaitBtn">Cancel</button>
        </div>
      </section>

      <section id="chat" class="screen">
        <div class="chat-header">
          <div class="identity-block">
            <span class="label">You</span>
            <div class="identity-row">
              <span id="myId" class="identity"></span>
              <button id="copyMyIdBtn" class="copy-button" type="button">Copy</button>
            </div>
          </div>
          <div class="identity-block">
            <span class="label">Peer</span>
            <span id="peerIdLabel" class="identity"></span>
          </div>
        </div>
        <div id="messageList" class="message-list"></div>
        <form id="chatForm" class="chat-form">
          <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
        <div class="file-row">
          <input id="fileInput" type="file" accept="image/*" />
          <button id="uploadBtn" type="button">Upload Image</button>
        </div>
        <button id="leaveBtn" class="secondary">Leave Chat</button>
        <div id="chatStatus" class="message"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
